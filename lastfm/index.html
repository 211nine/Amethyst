<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Amethyst · Last.fm</title>
  <style>
    :root {
      --bg: #0c0c0f;
      --panel: #151419;
      --border: #29272e;
      --text: #f5f3f7;
      --muted: #9a96a1;
      --accent: #b64fff;
      --danger: #ff6577;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(700px 380px at 50% -120px, rgba(182, 79, 255, 0.18), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .panel {
      width: min(440px, 100%);
      padding: 30px;
      background: rgba(21, 20, 25, 0.94);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.32);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      color: #d9d5de;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .brand img {
      width: 26px;
      height: 26px;
      border-radius: 7px;
    }

    .status {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      border: 1px solid rgba(182, 79, 255, 0.34);
      border-radius: 50%;
      background: rgba(182, 79, 255, 0.11);
      color: #ca7bff;
      font-size: 24px;
      font-weight: 700;
    }

    .status.error {
      border-color: rgba(255, 101, 119, 0.34);
      background: rgba(255, 101, 119, 0.1);
      color: var(--danger);
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .hint {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #242228;
      color: #74707b;
      font-size: 12px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 11px 14px;
      border: 1px solid #333039;
      border-radius: 10px;
      background: #1d1b21;
      color: #ddd9e1;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #242129; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">
      <img src="../icon.png" alt="">
      <span>Amethyst</span>
    </div>

    <div id="status" class="status">✓</div>
    <h1 id="title">Last.fm connected</h1>
    <p id="message">Your Last.fm account is now linked to Amethyst.</p>

    <button type="button" onclick="window.close()">Close this tab</button>
    <div class="hint">You can return to Amethyst now.</div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const isError = params.get("status") === "error";
    const title = params.get("title");
    const message = params.get("message");
    const status = document.getElementById("status");

    if (title) document.getElementById("title").textContent = title;
    if (message) document.getElementById("message").textContent = message;

    if (isError) {
      status.textContent = "×";
      status.classList.add("error");
    }
  </script>
</body>
</html>
